# Nome do projeto Compose. Sem isto, o Compose deriva o nome do diretório
# ("deploy") — é assim que a aplicação aparece no painel Docker da Hostinger.
name: hookify

services:
  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile.backend
    container_name: hookify-backend
    restart: unless-stopped
    # O default do Docker e 10s entre o SIGTERM e o SIGKILL. Requisicao mais longa
    # que isso — upload chunked de video, operacao em lote na Meta — era morta no
    # meio EM TODO DEPLOY. O uvicorn 0.32 encerra graciosamente no SIGTERM (para de
    # aceitar conexao e espera as em voo), entao a janela maior e aproveitada de
    # fato. Ver tambem --timeout-graceful-shutdown no Dockerfile.backend, menor que
    # este valor para o processo sair por conta propria antes do SIGKILL.
    stop_grace_period: 60s
    # Vars de runtime do backend vêm 100% de ../backend/.env (env_file abaixo).
    # Não duplicar com "- VAR=${VAR}" no environment: lá o ${VAR} é resolvido
    # pelo docker-compose contra deploy/.env (ou shell), e quando vazio sobrescreve
    # o valor do env_file com string vazia.
    environment:
      - CORS_ORIGINS=https://hookifyads.com,https://www.hookifyads.com,https://api.hookifyads.com
      - LOG_LEVEL=${LOG_LEVEL:-info}
    env_file:
      - ../backend/.env
    networks:
      - hookify-network
    labels:
      - "traefik.enable=true"
      # Rota via hookifyads.com/api (proxied pelo Cloudflare - sem uploads grandes)
      - "traefik.http.routers.backend.rule=Host(`hookifyads.com`) && (PathPrefix(`/api`) || PathPrefix(`/facebook`) || PathPrefix(`/analytics`) || PathPrefix(`/billing`) || Path(`/health`))"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=mytlschallenge"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.backend-stripprefix.stripprefix.prefixes=/api"
      # Anti-flood grosseiro por IP na borda (o rate limit fino, por usuário,
      # vive no FastAPI — app/core/rate_limit.py). Na rota via Cloudflare o
      # "IP" visto aqui é da CF (agregado) — aceitável: é só contenção bruta.
      - "traefik.http.middlewares.backend-ratelimit.ratelimit.average=50"
      - "traefik.http.middlewares.backend-ratelimit.ratelimit.burst=100"
      - "traefik.http.routers.backend.middlewares=backend-stripprefix,backend-ratelimit"
      # Rota via api.hookifyads.com (DNS only no Cloudflare - sem limite de 100MB)
      - "traefik.http.routers.backend-direct.rule=Host(`api.hookifyads.com`)"
      - "traefik.http.routers.backend-direct.entrypoints=websecure"
      - "traefik.http.routers.backend-direct.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.backend-direct.service=backend"
      - "traefik.http.routers.backend-direct.middlewares=backend-ratelimit"
      - "traefik.docker.network=hookify-network"

  frontend:
    # IMPORTANTE: build args do Next.js são resolvidos em build-time, então
    # NÃO podem vir de env_file (que injeta só em runtime). Os ${NEXT_PUBLIC_*}
    # e ${SENTRY_*} abaixo precisam estar em deploy/.env (ou exportados no shell)
    # ANTES do `docker compose build/up`, senão são embedados como string vazia
    # no bundle do Next e o app sobe sem URL do Supabase no cliente.
    build:
      context: ../frontend
      dockerfile: ../deploy/Dockerfile.frontend
      args:
        - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-https://api.hookifyads.com}
        - NEXT_PUBLIC_FB_REDIRECT_URI=${NEXT_PUBLIC_FB_REDIRECT_URI:-https://hookifyads.com/callback}
        - NEXT_PUBLIC_USE_REMOTE_API=${NEXT_PUBLIC_USE_REMOTE_API:-true}
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY}
        - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN}
        - NEXT_PUBLIC_BILLING_PIX_ENABLED=${NEXT_PUBLIC_BILLING_PIX_ENABLED:-false}
        - SENTRY_ORG=${SENTRY_ORG}
        - SENTRY_PROJECT=${SENTRY_PROJECT}
      # SENTRY_AUTH_TOKEN vai como SECRET, não como build arg: args ficam gravados nas
      # camadas da imagem (`docker history` expõe). Como secret, ele só existe durante
      # o RUN do build. Se não estiver no ambiente, o build segue sem upload de source maps.
      secrets:
        - sentry_auth_token
    container_name: hookify-frontend
    restart: unless-stopped
    # Mesmo motivo do backend. Verificado no runtime do Next 15 desta imagem
    # (start-server.js): o handler de SIGTERM chama server.close(), para de aceitar
    # conexao nova, espera as em voo e so entao sai — ou seja, a janela maior nao e
    # decorativa aqui. 30s bastam: as respostas do front sao curtas.
    stop_grace_period: 30s
    environment:
      - NODE_ENV=production
      # Fetches SERVER-SIDE do Next (ex.: página pública /s/[token]) não conseguem
      # alcançar o próprio domínio público de dentro da rede Docker (hairpin via
      # Traefik falha) — usam o DNS interno do compose. Runtime env (não build arg):
      # vars sem NEXT_PUBLIC_ não são inlined no bundle, o Node lê na hora.
      - API_BASE_INTERNAL_URL=http://backend:8000
      # Remover as outras - já estão no env_file e nos build args
    env_file:
      - ../frontend/.env.local
    networks:
      - hookify-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`hookifyads.com`) || Host(`www.hookifyads.com`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=mytlschallenge"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.frontend-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.frontend.middlewares=frontend-headers"
      - "traefik.docker.network=hookify-network"

secrets:
  # Lê o valor de SENTRY_AUTH_TOKEN do ambiente (deploy/.env ou shell) no momento do
  # build e o entrega ao BuildKit como secret — nunca como camada da imagem.
  # Requer Docker Compose >= 2.23 (VPS roda v5.x).
  sentry_auth_token:
    environment: SENTRY_AUTH_TOKEN

networks:
  hookify-network:
    external: true

